name: Nabi
options:
  bundleIdPrefix: org.nabi
  deploymentTarget:
    iOS: "17.2"
packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
targets:
  Nabi:
    type: application
    platform: iOS
    sources: [NabiApp]
    # XcodeGen rewrites these two files from the properties below on every
    # `xcodegen generate`, so edit the keys here, not in the .plist files.
    info:
      path: NabiApp/Info.plist
      properties:
        CFBundleDisplayName: Nabi
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [nabi]
        # Required by the Wearables Device Access Toolkit, including with the mock device.
        MWDAT:
          AppLinkURLScheme: "nabi://"
          MetaAppID: $(META_APP_ID)
          ClientToken: $(CLIENT_TOKEN)
          TeamID: $(DEVELOPMENT_TEAM)
        # Same as Meta's DisplayAccess sample.
        UIBackgroundModes: [processing, bluetooth-central, bluetooth-peripheral]
        NSBluetoothAlwaysUsageDescription: Nabi uses Bluetooth to connect to your glasses.
        NSLocalNetworkUsageDescription: Nabi uses the local network to connect to your glasses and the robot arm.
        NSBonjourServices: [_bonjour._tcp]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: NabiApp/Nabi.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)$(CFBundleIdentifier)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nabi.app
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        # Automatic signing. For an iPhone build pass DEVELOPMENT_TEAM=<your team ID>.
        CODE_SIGN_STYLE: Automatic
        # No Meta app ID is needed with the mock device; "0" means "none".
        META_APP_ID: "0"
        CLIENT_TOKEN: ""
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATDisplay
      - package: MWDAT
        product: MWDATInputs
      - package: MWDAT
        product: MWDATMockDevice
schemes:
  Nabi:
    build:
      targets:
        Nabi: all
    run:
      config: Debug
