name: Meta sample check (temporary)

# Runs Meta's own CameraAccess unit tests, which pair a mock device and wait for it,
# to see whether Mock Device Kit connects on this runner at all.
on:
  push:
    paths: [".github/workflows/meta-sample-check.yml"]
  workflow_dispatch:

jobs:
  sample-tests:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check out Meta's toolkit repo
        run: git clone --depth 1 https://github.com/facebook/meta-wearables-dat-ios meta

      - name: Run CameraAccess unit tests on a simulator
        working-directory: meta/samples/CameraAccess
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d for x in d[r] if x['name'].startswith('iPhone')))")
          xcodebuild test -project CameraAccess.xcodeproj -scheme CameraAccess \
            -destination "id=$DEVICE" -only-testing:CameraAccessTests \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual \
            2>&1 | grep -E "Test Case|error|passed|failed|Executed|\*\*" | tail -60
